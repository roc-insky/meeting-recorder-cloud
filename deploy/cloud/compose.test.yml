# Local-only integration stack for the cloud meeting recorder.
#
# Contains PostgreSQL 16 and a private, ephemeral S3-compatible service (MinIO).
# No public business data, no production credentials, no public ingress.
#
# Status: NOT EXECUTED by Task 4. This host has no Docker (ruling R3); the file is
# a checked-in deliverable so the documented test path is reproducible elsewhere:
#   docker compose -f deploy/cloud/compose.test.yml up -d --wait
#   TEST_DATABASE_URL=postgresql+psycopg://cloud:cloud@127.0.0.1:55432/cloud_test \
#     python -m unittest tests.cloud.test_auth -v
name: cloud-recorder-test

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cloud
      POSTGRES_PASSWORD: cloud
      POSTGRES_DB: cloud_test
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloud -d cloud_test"]
      interval: 2s
      timeout: 3s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --address ":9000" --console-address ":9001"
    environment:
      MINIO_ROOT_USER: cloud
      MINIO_ROOT_PASSWORD: cloud-test-secret
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    tmpfs:
      - /data

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      - minio
    entrypoint:
      - /bin/sh
      - -c
      - |
        until mc alias set local http://minio:9000 cloud cloud-test-secret; do
          sleep 1
        done
        mc mb --ignore-existing local/cloud-test
        mc anonymous set none local/cloud-test
