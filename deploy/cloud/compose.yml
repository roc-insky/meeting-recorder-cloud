# Cloud recorder deployment scaffold (Task 17).
#
# AUTHORED ONLY. It has never been built, started or tested: Docker is
# unavailable on the macOS worktree (ruling R3), and Linux, images, model
# weights and deployment are all not_run. G0-G4 are unanswered, so production
# startup still refuses the fake identity provider: the api and worker
# containers exit until a real provider exists. Do not treat this file as
# deployment evidence and do not deploy it as-is.
#
# Every credential, secret and TLS path is a required environment variable:
# compose refuses to start when one is missing. There are no default
# passwords and no published database or object-store ports; audio objects
# live on the objectsdata volume mounted by api and worker, and no service
# binds the existing local GUI port 3080.
#
# Usage (after G0-G4 approval, a real identity provider and a measured
# model manifest; export every required variable first):
#   docker compose -f deploy/cloud/compose.yml up -d
#   docker compose -f deploy/cloud/compose.yml --profile worker up -d worker

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [internal]

  api:
    build:
      context: ../..
      dockerfile: deploy/cloud/Dockerfile.api
      args:
        FFMPEG_VERSION: ${FFMPEG_VERSION:?FFMPEG_VERSION build arg is required}
    restart: unless-stopped
    environment:
      # Production refuses the fake identity provider until G1 is answered.
      CLOUD_ENVIRONMENT: production
      CLOUD_HOST: 0.0.0.0
      CLOUD_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:?}
      CLOUD_SECRET_KEY: ${CLOUD_SECRET_KEY:?CLOUD_SECRET_KEY is required}
      CLOUD_COOKIE_SECURE: "true"
      CLOUD_PUBLIC_BASE_URL: ${CLOUD_PUBLIC_BASE_URL:?CLOUD_PUBLIC_BASE_URL is required}
      CLOUD_FORWARDED_ALLOW_IPS: ${CLOUD_FORWARDED_ALLOW_IPS:?CLOUD_FORWARDED_ALLOW_IPS is required}
      CLOUD_PRIVACY_AUDIT_PATH: /var/lib/cloud/privacy-audit.jsonl
      CLOUD_VOICEPRINT_KEY: ${CLOUD_VOICEPRINT_KEY:?CLOUD_VOICEPRINT_KEY is required}
      CLOUD_OBJECTS_DIR: /var/lib/meeting-recorder/objects
      CLOUD_OBJECTS_MIN_FREE_BYTES: "1073741824"
      # An empty/blocked manifest keeps model readiness false; uploads still work.
      CLOUD_MODEL_MANIFEST: /models/model-manifest.json
      CLOUD_MODEL_CACHE: /models
    volumes:
      - ${CLOUD_MODEL_CACHE_DIR:?CLOUD_MODEL_CACHE_DIR is required}:/models:ro
      - audit:/var/lib/cloud
      - objectsdata:/var/lib/meeting-recorder
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]

  # Explicit opt-in only: this container has no ASR processor yet. With
  # CLOUD_ENVIRONMENT=production it first exits 2 with worker_settings_invalid
  # because G1 is unanswered; after G1 it exits 2 with
  # worker_processor_not_configured. It sits behind a profile so `up` cannot
  # mistake it for a working processing tier, and restart is off.
  worker:
    profiles: ["worker"]
    build:
      context: ../..
      dockerfile: deploy/cloud/Dockerfile.worker
      args:
        FFMPEG_VERSION: ${FFMPEG_VERSION:?FFMPEG_VERSION build arg is required}
    restart: "no"
    environment:
      CLOUD_ENVIRONMENT: production
      CLOUD_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:?}
      CLOUD_SECRET_KEY: ${CLOUD_SECRET_KEY:?CLOUD_SECRET_KEY is required}
      CLOUD_PUBLIC_BASE_URL: ${CLOUD_PUBLIC_BASE_URL:?CLOUD_PUBLIC_BASE_URL is required}
      CLOUD_VOICEPRINT_KEY: ${CLOUD_VOICEPRINT_KEY:?CLOUD_VOICEPRINT_KEY is required}
      CLOUD_OBJECTS_DIR: /var/lib/meeting-recorder/objects
      CLOUD_OBJECTS_MIN_FREE_BYTES: "1073741824"
      CLOUD_MODEL_MANIFEST: /models/model-manifest.json
      CLOUD_MODEL_CACHE: /models
    volumes:
      - ${CLOUD_MODEL_CACHE_DIR:?CLOUD_MODEL_CACHE_DIR is required}:/models:ro
      - objectsdata:/var/lib/meeting-recorder
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTPS_PORT:?HTTPS_PORT is required}:443"
    volumes:
      - ./proxy.conf:/etc/nginx/conf.d/default.conf:ro
      - ${TLS_CERT_PATH:?TLS_CERT_PATH is required}:/etc/nginx/tls/fullchain.pem:ro
      - ${TLS_KEY_PATH:?TLS_KEY_PATH is required}:/etc/nginx/tls/privkey.pem:ro
    depends_on:
      api:
        condition: service_healthy
    networks:
      edge: {}
      internal:
        ipv4_address: 172.31.240.10

networks:
  edge: {}
  # Private service network; change the subnet if it collides with the host.
  # nginx keeps a fixed address so uvicorn trusts exactly one proxy hop.
  internal:
    internal: true
    ipam:
      config:
        - subnet: 172.31.240.0/24

volumes:
  pgdata: {}
  objectsdata: {}
  audit: {}
