# TLS same-origin reverse proxy for the cloud recorder (Task 17).
#
# AUTHORED ONLY: never started or tested (no Docker/nginx on this macOS
# worktree). The certificate paths, domain and TLS material are supplied by
# the operator and are unverified. The file is mounted read-only at
# /etc/nginx/conf.d/default.conf by deploy/cloud/compose.yml.
#
# No HTTP listener is defined and port 80 is not published: add an edge
# redirect only if the deployment terminates plain HTTP somewhere else.
# No CORS header is emitted: the web client is served same-origin through
# this proxy.

upstream cloud_api {
    server api:8300;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;  # operator sets the real domain (SNI is required)

    ssl_certificate     /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:cloud_tls:10m;
    ssl_session_timeout 1h;

    server_tokens off;

    # 30 MiB request cap. A multipart body of exactly 30 MiB exceeds this
    # once boundaries and headers are counted and is rejected with 413:
    # the cap bounds the whole request, not just the file part.
    client_max_body_size 30m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 10s;
    proxy_read_timeout    60s;
    proxy_send_timeout    60s;

    # Server-sent events: never buffer and never cache, and keep the stream
    # open well past the default read timeout.
    location ~ ^/api/cloud/meetings/[^/]+/events/stream$ {
        proxy_pass            http://cloud_api;
        proxy_buffering       off;
        proxy_cache           off;
        proxy_read_timeout    3600s;
        proxy_send_timeout    3600s;
    }

    # Range requests and 206 responses pass through unchanged, and private
    # responses keep the no-store header set by the application.
    location / {
        proxy_pass            http://cloud_api;
        proxy_buffering       off;
    }
}
