    <title>Cloud capture fixture</title>
  </head>
  <body>
    <h1>Cloud capture fixture</h1>
    <p id="status">fixture ready</p>

      window.__fixtureReady = true;
      document.getElementById("status").textContent = "fixture ready";
    </script>
